version: 2
updates:
  # The Bun ecosystem updates npm packages and bun.lock together.
  # Monthly, one grouped pull request per ecosystem, to keep update traffic low.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ["*"]
    ignore:
      # SvelteKit 3.1 and svelte-check 4.7 accept TypeScript 6 only.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # The windows crates move together, with a Rust toolchain bump (0.100 needs rustc 1.95);
      # windows-core must match windows for #[implement].
      - dependency-name: "windows"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "windows-core"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "windows-registry"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  # zizmor, pinned by version and wheel hash for the CI workflow audit.
  - package-ecosystem: pip
    directory: /.github/zizmor
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
